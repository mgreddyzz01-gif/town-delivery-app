<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Town Express Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold text-indigo-600 mb-4">Town Delivery Order</h2>
        
        <!-- Estimated Bill -->
        <label class="block mb-1 text-sm font-medium text-gray-700">Estimated Store Bill (₹)</label>
        <input type="number" id="storeBill" value="500" class="w-full p-2 border rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">

        <!-- Distance -->
        <label class="block mb-1 text-sm font-medium text-gray-700">Delivery Distance (in KM)</label>
        <input type="number" id="distance" value="4" class="w-full p-2 border rounded-lg mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">

        <!-- Payment Method Selection -->
        <label class="block mb-1 text-sm font-medium text-gray-700">Payment Method</label>
        <select id="paymentMethod" class="w-full p-2 border rounded-lg mb-4 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="COD">Cash on Delivery (COD)</option>
            <option value="UPI">Prepaid UPI</option>
        </select>

        <!-- Rider Selection -->
        <label class="block mb-1 text-sm font-medium text-gray-700">Assign Rider</label>
        <select id="riderName" class="w-full p-2 border rounded-lg mb-6 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Rider 1">Rider 1</option>
            <option value="Rider 2">Rider 2</option>
        </select>

        <button onclick="calculateOrder()" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
            Place Order & Calculate Split
        </button>

        <!-- Order Results Card -->
        <div id="result" class="mt-6 p-4 bg-indigo-50 border border-indigo-100 rounded-lg hidden">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-lg text-gray-800">Order Placed!</h3>
                <span id="orderId" class="text-xs bg-indigo-200 text-indigo-800 font-bold px-2 py-1 rounded"></span>
            </div>
            
            <p class="text-sm text-gray-600">Delivery Fee: <span id="deliveryFee" class="font-bold text-indigo-600"></span></p>
            <p class="text-xl font-extrabold text-gray-900 mt-1">Total Pay: <span id="totalPay"></span></p>

            <hr class="my-3 border-gray-300">

            <h3 class="font-bold text-sm text-gray-700 mb-1">Operator Settlement Split</h3>
            <p class="text-xs text-gray-600">Fuel Paid to Rider: <span id="fuelCost" class="font-medium text-red-600"></span></p>
            <p class="text-xs text-gray-600">Rider Take-Home Pay: <span id="riderNet" class="font-medium text-green-600"></span></p>
            <p class="text-xs text-gray-600 font-bold">Operator Net Profit: <span id="opProfit" class="text-blue-600"></span></p>
        </div>
    </div>

    <script>
        async function calculateOrder() {
            const storeBill = Number(document.getElementById('storeBill').value);
            const distanceKm = Number(document.getElementById('distance').value);
            const paymentMethod = document.getElementById('paymentMethod').value;
            const riderName = document.getElementById('riderName').value;

            try {
                const response = await fetch('/api/calculate-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ distanceKm, storeBill, paymentMethod, riderName })
                });

                const data = await response.json();
                const order = data.order; // Read from order object

                document.getElementById('orderId').innerText = 'Order #' + order.id;
                document.getElementById('deliveryFee').innerText = '₹' + order.deliveryFee;
                document.getElementById('totalPay').innerText = '₹' + order.totalCustomerPay;
                document.getElementById('fuelCost').innerText = '₹' + order.fuelReimbursement;
                document.getElementById('riderNet').innerText = '₹' + order.riderNetPay;
                document.getElementById('opProfit').innerText = '₹' + order.operatorNetProfit;

                document.getElementById('result').classList.remove('hidden');
            } catch (error) {
                alert('Error connecting to server! Make sure node server.js is running.');
            }
        }
    </script>
</body>
</html>
