<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Delivery Portal</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; margin: 0; padding: 16px; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; }
        .card { background: #131b2e; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
        .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; font-weight: 700; margin-top: 10px; cursor: pointer; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-success { background: #10b981; }
        .btn-maps { background: #0284c7; }
        .btn-store { background: #eab308; color: #000; }
        .order-box { background: #1e293b; border-left: 4px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .split-card { background: #0f172a; border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 13px; line-height: 1.6; }
        .pay-tag { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .tag-cod { background: #ea580c; color: #fff; }
        .tag-online { background: #0284c7; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2>🛵 Rider Portal</h2>
        <button onclick="fetchAssignedOrders()" style="background:#1e293b; color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer;">🔄 Refresh</button>
    </div>

    <div class="card">
        <h3>📋 Assigned Orders</h3>
        <div id="assignedOrdersList">Loading...</div>
    </div>
</div>

<script>
    async function fetchAssignedOrders() {
        try {
            const res = await fetch('/api/orders');
            const orders = await res.json();
            const container = document.getElementById('assignedOrdersList');
            const activeOrders = orders.filter(o => o.status === 'Assigned');

            if (activeOrders.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8; font-size:14px; text-align:center;">No assigned orders currently.</p>';
                return;
            }

            container.innerHTML = activeOrders.map(order => `
                <div class="order-box">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong>Order #${order.id}</strong>
                        <span class="pay-tag ${order.paymentMethod === 'Online' ? 'tag-online' : 'tag-cod'}">${order.paymentMethod || 'COD'}</span>
                    </div>
                    <p style="margin:8px 0 4px 0; font-size:14px;"><strong>Pickup Store:</strong> <span style="color:#fde047;">${order.selectedStore}</span></p>
                    <p style="margin:0 0 4px 0; font-size:14px;"><strong>Customer:</strong> ${order.name} (${order.phone})</p>
                    <p style="margin:0 0 4px 0; font-size:13px; color:#94a3b8;"><strong>Address:</strong> ${order.address}</p>
                    <p style="margin:0 0 8px 0; font-size:13px; color:#cbd5e1;"><strong>Items:</strong> ${order.items}</p>

                    <div class="split-card">
                        📍 <strong>Distance from ${order.selectedStore}:</strong> ${order.distanceKm} KM<br>
                        💵 <strong>Collect Delivery Fee:</strong> ₹${order.deliveryFee} ${order.paymentMethod === 'Online' ? '(Paid Online)' : '(Collect Cash)'}<br>
                        💰 <strong>Rider Payout:</strong> ₹${order.riderPayout}
                    </div>

                    ${order.storeMapsUrl ? `<a href="${order.storeMapsUrl}" target="_blank" class="btn btn-store">🏬 Open Pickup Store Location</a>` : ''}
                    ${order.mapsUrl ? `<a href="${order.mapsUrl}" target="_blank" class="btn btn-maps">🗺️ Open Customer GPS Location</a>` : ''}
                    <button class="btn btn-success" onclick="markDelivered(${order.id})">✅ Mark as Delivered</button>
                </div>
            `).join('');
        } catch (err) {
            document.getElementById('assignedOrdersList').innerHTML = '<p style="color:#ef4444;">Failed to load orders.</p>';
        }
    }

    async function markDelivered(orderId) {
        alert(`Order #${orderId} delivered!`);
        fetchAssignedOrders();
    }

    fetchAssignedOrders();
    setInterval(fetchAssignedOrders, 10000);
</script>

</body>
</html>
