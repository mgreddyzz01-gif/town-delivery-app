<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Town Delivery Order Entry</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; }
        .card { background: white; max-width: 450px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { color: #1a1a1a; margin-top: 0; text-align: center; }
        label { font-weight: 600; display: block; margin-top: 12px; color: #333; }
        input, select { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: #007bff; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; margin-top: 18px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .wa-btn { background-color: #25D366; display: none; margin-top: 10px; }
        .wa-btn:hover { background-color: #128C7E; }
        .result-box { margin-top: 20px; background: #eef7ff; padding: 15px; border-radius: 8px; border-left: 5px solid #007bff; display: none; }
        .result-box h3 { margin: 0 0 10px 0; font-size: 18px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
        .total-row { border-top: 1px dashed #bbb; padding-top: 6px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚚 Town Delivery</h2>

    <label for="riderName">Rider Name</label>
    <select id="riderName">
        <option value="Rider 1">Rider 1</option>
        <option value="Rider 2">Rider 2</option>
        <option value="Rider 3">Rider 3</option>
    </select>

    <label for="paymentMethod">Payment Method</label>
    <select id="paymentMethod">
        <option value="COD">Cash on Delivery (COD)</option>
        <option value="UPI">Prepaid (UPI / Online)</option>
    </select>

    <label for="distanceKm">One-Way Distance (km)</label>
    <input type="number" id="distanceKm" step="0.1" placeholder="e.g. 2.5">

    <label for="storeBill">Store Items Bill (₹)</label>
    <input type="number" id="storeBill" placeholder="e.g. 250">

    <button onclick="submitOrder()">Calculate & Record Order</button>

    <div id="resultBox" class="result-box">
        <h3>Order Receipt</h3>
        <div class="result-row"><span>Store Bill:</span> <span id="rStoreBill">₹0</span></div>
        <div class="result-row"><span>Delivery Fee:</span> <span id="rDeliveryFee">₹0</span></div>
        <div class="result-row total-row"><span>Total Customer Pay:</span> <span id="rTotal">₹0</span></div>
    </div>

    <button id="waBtn" class="wa-btn" onclick="sendWhatsAppReceipt()">📲 Share Bill on WhatsApp</button>
</div>

<script>
    let currentOrder = null;

    async function submitOrder() {
        const riderName = document.getElementById('riderName').value;
        const paymentMethod = document.getElementById('paymentMethod').value;
        const distanceKm = document.getElementById('distanceKm').value;
        const storeBill = document.getElementById('storeBill').value;

        if (!distanceKm || !storeBill) {
            alert("Please enter distance and store bill!");
            return;
        }

        const response = await fetch('/api/calculate-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ riderName, paymentMethod, distanceKm, storeBill })
        });

        const data = await response.json();
        currentOrder = data.order;

        document.getElementById('rStoreBill').innerText = '₹' + currentOrder.storeBill;
        document.getElementById('rDeliveryFee').innerText = '₹' + currentOrder.deliveryFee;
        document.getElementById('rTotal').innerText = '₹' + currentOrder.totalCustomerPay;

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('waBtn').style.display = 'block';
    }

    function sendWhatsAppReceipt() {
        if (!currentOrder) return;
        const text = `*--- TOWN DELIVERY RECEIPT ---*\n` +
                     `📦 Order #${currentOrder.id}\n` +
                     `🛒 Store Items: ₹${currentOrder.storeBill}\n` +
                     `🚚 Delivery Fee: ₹${currentOrder.deliveryFee}\n` +
                     `-----------------------------\n` +
                     `💰 *TOTAL PAYABLE: ₹${currentOrder.totalCustomerPay}*\n` +
                     `💳 Payment Mode: ${currentOrder.paymentMethod}\n` +
                     `-----------------------------\n` +
                     `Thank you for using Town Delivery!`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
</script>

</body>
</html>
