<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - Town Express</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; margin: 0; padding: 16px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #131b2e; border-radius: 14px; padding: 24px; width: 100%; max-width: 440px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #f8fafc; font-size: 24px; }
        .header p { margin: 6px 0 0 0; color: #94a3b8; font-size: 13px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        input, textarea, select { width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
        textarea { resize: vertical; min-height: 70px; }
        .btn { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #059669; }
        .location-status { font-size: 12px; padding: 8px; border-radius: 6px; margin-bottom: 14px; text-align: center; }
        .loc-success { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .loc-pending { background: rgba(234, 179, 8, 0.15); color: #fde047; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🛵 Town Express</h2>
        <p>Fast local deliveries directly to your door</p>
    </div>

    <div id="locationBanner" class="location-status loc-pending">
        📡 Acquiring your current delivery location...
    </div>

    <!-- Order Submission Form -->
    <form id="orderForm" onsubmit="submitOrder(event)">
        <div class="form-group">
            <label>Your Full Name</label>
            <input type="text" id="name" placeholder="e.g. Raj Kumar" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
            <label>Items to Order</label>
            <textarea id="items" placeholder="List items needed (e.g., 1kg Sugar, 1 Pack Milk)" required></textarea>
        </div>

        <div class="form-group">
            <label>Delivery Address / Landmark</label>
            <input type="text" id="address" placeholder="e.g. Pannapur road, near bus stop" required>
        </div>

        <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod">
                <option value="COD">Cash on Delivery (COD)</option>
                <option value="Online">Online Payment</option>
            </select>
        </div>

        <button type="submit" class="btn">Place Order</button>
    </form>

    <!-- Confirmation Screen -->
    <div id="confirmationCard" style="display: none; text-align: center;">
        <div style="border: 2px solid #10b981; border-radius: 12px; padding: 20px; background: rgba(16, 185, 129, 0.05);">
            <h3 style="color: #10b981; margin-top: 0;">✅ Order Received!</h3>
            <h2 id="displayOrderId" style="margin: 8px 0;">Order #101</h2>

            <div style="background: #0f172a; border-radius: 8px; padding: 14px; margin: 16px 0; text-align: left; border: 1px solid #334155; font-size: 13px; line-height: 1.6;">
                <p style="margin: 0 0 6px 0;">🛵 <strong>Base Delivery Fee:</strong> ₹20</p>
                <p style="margin: 0 0 6px 0;">📍 <strong>Distance Rate:</strong> +₹10 per KM</p>
                <p style="margin: 0; color: #94a3b8; font-size: 11px;">ℹ️ Final exact distance and total bill will be calculated when your store is assigned.</p>
            </div>

            <button onclick="location.reload()" class="btn" style="background: #0284c7;">Place Another Order</button>
        </div>
    </div>
</div>

<script>
    let userLat = null;
    let userLng = null;

    // Capture GPS Location on Load
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                const banner = document.getElementById('locationBanner');
                banner.className = 'location-status loc-success';
                banner.innerHTML = '📍 GPS Location Acquired!';
            },
            (err) => {
                const banner = document.getElementById('locationBanner');
                banner.className = 'location-status loc-pending';
                banner.innerHTML = '⚠️ GPS unavailable. Address will be used.';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    async function submitOrder(e) {
        e.preventDefault();
        
        const payload = {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            items: document.getElementById('items').value,
            address: document.getElementById('address').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            lat: userLat,
            lng: userLng
        };

        const res = await fetch('/api/customer/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.success) {
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('locationBanner').style.display = 'none';
            document.getElementById('displayOrderId').innerText = `Order #${result.order.id}`;
            document.getElementById('confirmationCard').style.display = 'block';
        } else {
            alert('Failed to submit order. Please try again.');
        }
    }
</script>

</body>
</html>
