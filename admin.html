<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard & Settlement</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 1200px; margin: 0 auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; text-align: center; }
        .stat-box h4 { margin: 0; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        .stat-box p { margin: 6px 0 0 0; font-size: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
        th { color: #94a3b8; text-transform: uppercase; }
        select, input[type="number"] { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 6px; border-radius: 6px; font-size: 12px; }
        .btn-assign { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-settle { background: #10b981; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 4px; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .pending { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .assigned { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .pay-cod { background: #ea580c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .pay-online { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .settled { color: #34d399; font-weight: bold; }
        .unsettled { color: #f87171; font-weight: bold; }
        #pinModal { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; max-width: 360px; margin: 100px auto; border: 1px solid #334155; }
        input[type="password"] { font-size: 20px; text-align: center; padding: 10px; width: 100%; margin: 16px 0; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 8px; }
    </style>
</head>
<body>

<div id="pinModal">
    <h3>🔒 Admin Access Required</h3>
    <form onsubmit="verifyPin(event)">
        <input type="password" id="pinInput" placeholder="••••" maxlength="4" required autofocus>
        <button type="submit" class="btn-assign" style="width: 100%; padding: 12px;">Login</button>
    </form>
</div>

<div class="card" id="dashboardContent" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2>📊 Order Assignment & Financial Settlement Dashboard</h2>
        <button onclick="loadOrders()" style="font-size:12px; padding:6px 12px; cursor:pointer;">🔄 Refresh</button>
    </div>

    <!-- Financial Summary Cards -->
    <div class="stats-grid">
        <div class="stat-box">
            <h4>💵 Cash (COD) Total</h4>
            <p style="color:#f97316;" id="totalCod">₹0</p>
        </div>
        <div class="stat-box">
            <h4>💳 Online Pay Total</h4>
            <p style="color:#38bdf8;" id="totalOnline">₹0</p>
        </div>
        <div class="stat-box">
            <h4>💰 Operator Profit</h4>
            <p style="color:#34d399;" id="totalProfit">₹0</p>
        </div>
        <div class="stat-box">
            <h4>✅ Settled Amount</h4>
            <p style="color:#a7f3d0;" id="totalSettled">₹0</p>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Customer Details</th>
                <th>Payment</th>
                <th>Store Bill (₹)</th>
                <th>Select Store</th>
                <th>Select Rider</th>
                <th>KM / Fee / Total</th>
                <th>Settlement</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>
</div>

<script>
    function verifyPin(e) {
        e.preventDefault();
        if (document.getElementById('pinInput').value === '5910') {
            document.getElementById('pinModal').style.display = 'none';
            document.getElementById('dashboardContent').style.display = 'block';
            loadOrders();
        } else {
            alert('Incorrect PIN!');
        }
    }

    async function loadOrders() {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        let totalCod = 0;
        let totalOnline = 0;
        let totalProfit = 0;
        let totalSettled = 0;

        orders.forEach(order => {
            const fee = order.deliveryFee || 0;
            const profit = order.operatorFee || 0;
            const grandTotal = order.grandTotal || fee;

            if (order.paymentMethod === 'Online') {
                totalOnline += grandTotal;
            } else {
                totalCod += grandTotal;
            }
            totalProfit += profit;
            if (order.settlementStatus === 'Settled') {
                totalSettled += grandTotal;
            }

            const mapBtn = order.mapsUrl ? `<br><a href="${order.mapsUrl}" target="_blank" style="color:#38bdf8;">📍 Customer GPS</a>` : '';
            const payBadge = order.paymentMethod === 'Online' ? `<span class="pay-online">ONLINE</span>` : `<span class="pay-cod">COD</span>`;
            
            const isSettled = order.settlementStatus === 'Settled';
            const nextStatus = isSettled ? 'Unsettled' : 'Settled';
            const settlementDisplay = isSettled 
                ? `<span class="settled">✅ Settled</span> <button class="btn-settle" style="background:#475569;" onclick="toggleSettlement(${order.id}, '${nextStatus}')">Undo</button>`
                : `<span class="unsettled">❌ Unsettled</span> <button class="btn-settle" onclick="toggleSettlement(${order.id}, '${nextStatus}')">Settle</button>`;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>#${order.id}</td>
                <td><span class="status-badge ${order.status.toLowerCase()}">${order.status}</span></td>
                <td><strong>${order.name}</strong> (${order.phone})<br><small style="color:#94a3b8">${order.address}</small>${mapBtn}</td>
                <td>${payBadge}</td>
                <td>
                    <input type="number" id="item-cost-${order.id}" value="${order.itemTotal || ''}" placeholder="Bill ₹" style="width:75px;">
                </td>
                <td>
                    <select id="store-select-${order.id}">
                        <option value="R mart" ${order.selectedStore === 'R mart' ? 'selected' : ''}>R mart</option>
                        <option value="VA mart" ${order.selectedStore === 'VA mart' ? 'selected' : ''}>VA mart</option>
                        <option value="Dodla milk products" ${order.selectedStore === 'Dodla milk products' ? 'selected' : ''}>Dodla milk products</option>
                        <option value="Jan Bakery" ${order.selectedStore === 'Jan Bakery' ? 'selected' : ''}>Jan Bakery</option>
                        <option value="Sneha book house" ${order.selectedStore === 'Sneha book house' ? 'selected' : ''}>Sneha book house</option>
                    </select>
                </td>
                <td>
                    <select id="rider-select-${order.id}">
                        <option value="Rider 1" ${order.rider === 'Rider 1' ? 'selected' : ''}>Rider 1</option>
                        <option value="Rider 2" ${order.rider === 'Rider 2' ? 'selected' : ''}>Rider 2</option>
                        <option value="Rider 3" ${order.rider === 'Rider 3' ? 'selected' : ''}>Rider 3</option>
                    </select>
                </td>
                <td>
                    <strong>${order.distanceKm} KM</strong><br>
                    Fee: ₹${order.deliveryFee}<br>
                    <small style="color:#fde047">Grand Total: ₹${grandTotal}</small><br>
                    <small style="color:#34d399">Profit: ₹${order.operatorFee}</small>
                </td>
                <td>${settlementDisplay}</td>
                <td><button class="btn-assign" onclick="assignRider(${order.id})">Save & Assign</button></td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('totalCod').innerText = `₹${totalCod}`;
        document.getElementById('totalOnline').innerText = `₹${totalOnline}`;
        document.getElementById('totalProfit').innerText = `₹${totalProfit}`;
        document.getElementById('totalSettled').innerText = `₹${totalSettled}`;
    }

    async function assignRider(orderId) {
        const store = document.getElementById(`store-select-${orderId}`).value;
        const rider = document.getElementById(`rider-select-${orderId}`).value;
        const itemTotal = document.getElementById(`item-cost-${orderId}`).value;

        await fetch(`/api/orders/${orderId}/assign`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ store, rider, itemTotal })
        });
        alert(`Order #${orderId} updated!`);
        loadOrders();
    }

    async function toggleSettlement(orderId, status) {
        await fetch(`/api/orders/${orderId}/settle`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ settlementStatus: status })
        });
        loadOrders();
    }
</script>

</body>
</html>
