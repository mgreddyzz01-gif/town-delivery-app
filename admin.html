<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settlement Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; }
        .card { background: white; max-width: 800px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .passcode-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .passcode-box { background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 300px; width: 100%; }
        .passcode-box input { width: 100%; padding: 10px; margin: 10px 0; text-align: center; font-size: 20px; letter-spacing: 4px; border: 1px solid #ccc; border-radius: 8px; }
        .passcode-box button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .filters { display: flex; gap: 10px; margin-bottom: 15px; }
        .filters select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; flex: 1; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f8f9fa; padding: 12px; border-radius: 8px; border-left: 4px solid #007bff; }
        .stat-card h4 { margin: 0; font-size: 13px; color: #666; }
        .stat-card p { margin: 5px 0 0 0; font-size: 20px; font-weight: bold; }
        .action-card { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; color: #856404; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #007bff; color: white; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-settle { background: #28a745; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
        .btn-clear { background: #dc3545; color: white; border: none; padding: 10px; border-radius: 6px; flex: 1; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="passcodeOverlay" class="passcode-overlay">
    <div class="passcode-box">
        <h3>🔒 Admin Access</h3>
        <p style="font-size:12px; color:#666;">Enter 4-digit PIN (Default: 1234)</p>
        <input type="password" id="pinInput" maxlength="4" placeholder="••••">
        <button onclick="checkPin()">Unlock Dashboard</button>
    </div>
</div>

<div class="card">
    <h2>📊 Admin Settlement Dashboard</h2>

    <div class="filters">
        <select id="filterRider" onchange="loadDashboard()">
            <option value="ALL">All Riders</option>
            <option value="Rider 1">Rider 1</option>
            <option value="Rider 2">Rider 2</option>
            <option value="Rider 3">Rider 3</option>
        </select>
        <select id="filterDate" onchange="loadDashboard()">
            <option value="ALL">All Time</option>
            <option value="TODAY">Today Only</option>
        </select>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h4>COD Cash Collected</h4><p id="statCod">₹0</p></div>
        <div class="stat-card"><h4>Total Rider Payout</h4><p id="statRiderPay">₹0</p></div>
        <div class="stat-card"><h4>Operator Net Profit</h4><p id="statOperatorProfit">₹0</p></div>
    </div>

    <div id="actionCard" class="action-card">EOD Action: Loading...</div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Rider</th>
                <th>Mode</th>
                <th>Bill</th>
                <th>Fee</th>
                <th>Rider Pay</th>
                <th>Operator</th>
            </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
    </table>

    <div class="btn-group">
        <button class="btn-settle" onclick="settleOrders()">Mark Orders Settled</button>
        <button class="btn-clear" onclick="clearOrders()">Reset Ledger</button>
    </div>
</div>

<script>
    function checkPin() {
        const pin = document.getElementById('pinInput').value;
        if (pin === '9818') { // Default PIN for admin access
            document.getElementById('passcodeOverlay').style.display = 'none';
            loadDashboard();
        } else {
            alert('Incorrect Passcode!');
        }
    }

    async function loadDashboard() {
        const rider = document.getElementById('filterRider').value;
        const date = document.getElementById('filterDate').value;

        const res = await fetch(`/api/admin/orders?rider=${rider}&date=${date}`);
        const orders = await res.json();

        let codCash = 0, riderPay = 0, operatorProfit = 0;
        const tableBody = document.getElementById('ordersTable');
        tableBody.innerHTML = '';

        orders.forEach(o => {
            if (o.paymentMethod === 'COD') codCash += o.totalCustomerPay;
            riderPay += (o.fuelReimbursement + o.riderNetPay);
            operatorProfit += o.operatorNetProfit;

            tableBody.innerHTML += `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.riderName}</td>
                    <td>${o.paymentMethod}</td>
                    <td>₹${o.storeBill}</td>
                    <td>₹${o.deliveryFee}</td>
                    <td>₹${(o.fuelReimbursement + o.riderNetPay).toFixed(1)}</td>
                    <td>₹${o.operatorNetProfit}</td>
                </tr>
            `;
        });

        document.getElementById('statCod').innerText = '₹' + codCash;
        document.getElementById('statRiderPay').innerText = '₹' + riderPay.toFixed(1);
        document.getElementById('statOperatorProfit').innerText = '₹' + operatorProfit.toFixed(1);

        const netDifference = codCash - riderPay;
        const actionBox = document.getElementById('actionCard');
        if (netDifference > 0) {
            actionBox.innerText = `💵 Collect ₹${netDifference.toFixed(1)} cash from Rider.`;
        } else if (netDifference < 0) {
            actionBox.innerText = `💸 Pay ₹${Math.abs(netDifference).toFixed(1)} to Rider.`;
        } else {
            actionBox.innerText = `✅ Accounts Balanced! No cash exchange needed.`;
        }
    }

    async function settleOrders() {
        if (confirm("Mark pending orders as settled?")) {
            await fetch('/api/admin/settle', { method: 'POST' });
            loadDashboard();
        }
    }

    async function clearOrders() {
        if (confirm("Are you sure you want to clear ALL order data?")) {
            await fetch('/api/admin/clear', { method: 'POST' });
            loadDashboard();
        }
    }
</script>

</body>
</html>
