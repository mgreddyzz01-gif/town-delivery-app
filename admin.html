<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settlement & Order Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; max-width: 900px; margin: 0 auto; }
        h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-size: 13px; text-transform: uppercase; }
        select { background: #0f172a; color: #fff; border: 1px solid #475569; padding: 6px 10px; border-radius: 6px; }
        .btn-assign { background: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .pending { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .assigned { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    </style>
</head>
<body>

<div class="card">
    <h2>📊 Order Assignment & Settlement Dashboard <button onclick="loadOrders()" style="font-size:12px; padding:6px 12px; cursor:pointer;">🔄 Refresh</button></h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Customer & Items</th>
                <th>Assigned Rider</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="ordersTable">
            <!-- Orders dynamically load here -->
        </tbody>
    </table>
</div>

<script>
    async function loadOrders() {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        const tbody = document.getElementById('ordersTable');
        tbody.innerHTML = '';

        orders.forEach(order => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>#${order.id}</td>
                <td><span class="status-badge ${order.status.toLowerCase()}">${order.status}</span></td>
                <td>
                    <strong>${order.name || 'Walk-in'}</strong> (${order.phone || 'N/A'})<br>
                    <small style="color:#94a3b8">${order.items || 'General Delivery'}</small>
                </td>
                <td>
                    <select id="rider-select-${order.id}">
                        <option value="Rider 1" ${order.rider === 'Rider 1' ? 'selected' : ''}>Rider 1</option>
                        <option value="Rider 2" ${order.rider === 'Rider 2' ? 'selected' : ''}>Rider 2</option>
                        <option value="Rider 3" ${order.rider === 'Rider 3' ? 'selected' : ''}>Rider 3</option>
                    </select>
                </td>
                <td>
                    <button class="btn-assign" onclick="assignRider(${order.id})">Assign Rider</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function assignRider(orderId) {
        const rider = document.getElementById(`rider-select-${orderId}`).value;
        await fetch(`/api/orders/${orderId}/assign`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rider })
        });
        alert(`Order #${orderId} assigned to ${rider}`);
        loadOrders();
    }

    loadOrders();
</script>
